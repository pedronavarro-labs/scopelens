name: ScopeLens checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04]
        python: ['3.10', '3.12', '3.13']
        include:
          - os: macos-15
            python: '3.12'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: scopelens scan examples/scoped.json --task read-code --repo demo/docs --fail-on warning --output artifacts/ci
      - run: python build_demo.py
      - run: git diff --exit-code -- demo
      - uses: actions/upload-artifact@v7
        with:
          name: scopelens-${{ matrix.os }}-${{ matrix.python }}
          path: artifacts/ci/
          if-no-files-found: error
