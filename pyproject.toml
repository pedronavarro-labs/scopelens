[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scopelens-lab"
version = "0.1.0"
description = "Evidence-aware permission reviews for GitHub Apps and MCP configurations"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Pedro Navarro"}]
readme = "README.md"
dependencies = []

[project.scripts]
scopelens = "scopelens:main"

[project.urls]
Repository = "https://github.com/pedronavarro-labs/scopelens"

[tool.setuptools]
py-modules = ["scopelens"]
